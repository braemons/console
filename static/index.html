<!--
  The braemons console.

  No build step, no framework, no CDN: triald's rule and statemachined's, for
  their reason (a rig box may have no route to the internet, and a browser in a
  booth must not wait on unpkg). Unlike those two, the console is not served by
  a daemon, so it also has no domain logic to build: every panel below is a
  custom element fetched from the daemon that owns the hardware it is about.

  What the console owns is on this page in its entirety: discovery, nav, and
  the layout around each panel -- reorder, resize, dock, hide, one status line
  per daemon. See docs/PLAN.md for the technical basis and docs/FINDINGS.md
  for what building the first working version of this actually showed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>braemons console</title>
    <link rel="stylesheet" href="/console.css" />
  </head>
  <body>
    <header class="bar">
      <h1>braemons</h1>
      <nav id="rig-nav" class="rig-nav"></nav>
      <span class="grow"></span>
      <label class="snap-toggle" title="round a resize to the nearest grid cell">
        <input type="checkbox" id="snap-to-grid" />snap to grid
      </label>
      <div id="minimize-controls" class="minimize-controls"></div>
      <button id="reset-layout" class="reset-layout" title="clear the remembered order, sizes, docked and hidden panels for this rig">reset layout</button>
      <span id="discovery-state" class="muted">discovering…</span>
    </header>

    <div id="banner" class="banner" hidden></div>
    <div id="dock" class="dock" hidden></div>
    <div id="hidden-tray" class="hidden-tray" hidden></div>

    <main id="panels"></main>

    <script type="module" src="/console.js"></script>
  </body>
</html>
